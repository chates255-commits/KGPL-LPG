<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · KGPL LPG System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1F4E79,#2E86AB);padding:1.5rem}
.box{background:#fff;border-radius:14px;padding:2rem;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{color:#1F4E79;font-size:1.2rem;text-align:center}
p{color:#64748b;font-size:.85rem;text-align:center;margin:.3rem 0 1.2rem}
label{display:block;font-size:.75rem;font-weight:600;color:#64748b;margin-bottom:.25rem}
input{width:100%;padding:.55rem .7rem;border:1px solid #e2e8f0;border-radius:8px;font-size:.95rem;margin-bottom:.85rem}
button{width:100%;padding:.65rem;background:#1F4E79;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.err{background:#fee2e2;color:#991b1b;padding:.55rem .7rem;border-radius:8px;margin-bottom:.85rem;font-size:.85rem}
</style>
</head>
<body>
<div class="box">
  <h1>KGPL LPG System</h1>
  <p>Kandla–Gorakhpur Pipeline · IHB</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="err">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <label>User ID</label>
    <input type="text" name="user_id" required autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
