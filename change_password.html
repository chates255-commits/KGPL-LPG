{% extends "base.html" %}
{% block title %}Change Password · KGPL{% endblock %}
{% block content %}
<h1>Change Password</h1>
<p class="sub">Update your login password</p>
<div class="sec" style="max-width:420px">
  <form method="post">
    <div class="fg" style="margin-bottom:.7rem">
      <label>Current Password</label>
      <input type="password" name="old" required>
    </div>
    <div class="fg" style="margin-bottom:.7rem">
      <label>New Password</label>
      <input type="password" name="new1" required minlength="6">
    </div>
    <div class="fg" style="margin-bottom:1rem">
      <label>Confirm New Password</label>
      <input type="password" name="new2" required minlength="6">
    </div>
    <button class="btn btn-p" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
